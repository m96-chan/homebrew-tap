name: verify-casks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Catch an asset that disappears or is replaced after the fact.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-casks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify every cask points at a genuine release asset
        run: python3 scripts/verify_casks.py
